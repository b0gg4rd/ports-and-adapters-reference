name: undertow-postgresql
run-name: ${{ github.actor }} launch the workflow for undertow-postgresql module
on:
  push:
    paths:
      - 'undertow-postgresql/**'
      - '.github/workflows/undertow-postgresql.yml'
  pull_request:
    paths:
      - 'undertow-postgresql/**'
      - '.github/workflows/undertow-postgresql.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: undertow-postgresql
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '25'
          cache: maven

      - name: Build and functional test
        run: |
          chmod +x mvnw
          ./mvnw -Djansi.force=true -ntp -P functional -U clean verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: undertow-postgresql
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '25'
          cache: maven

      - name: Build native image and Docker image
        run: |
          chmod +x mvnw
          ./mvnw -B -Djansi.force=true -ntp -P prod -U clean package docker:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          ./mvnw -B -Djansi.force=true -ntp -P prod docker:push \
            -Ddocker.username=${{ github.actor }} \
            -Ddocker.password=${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Database migrate and deploy to Render
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: undertow-postgresql
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '25'
          cache: maven

      - name: Run Liquibase against Postgres
        run: |
          env
          chmod +x mvnw
          ./mvnw -B -Djansi.force=true -ntp -P migrate process-resources -X
          cat target/classes/liquibase/liquibase.properties
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      - name: Trigger Render deploy with specific image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_UNDERTOW_POSTGRESQL }}
        run: |
          IMAGE_TAG="$(./mvnw -q -Dexpression=project.version -DforceStdout help:evaluate)"
          echo "Deploying image tag: ${IMAGE_TAG}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"ghcr.io/b0gg4rd/ports-and-adapters-reference-undertow-postgresql:${IMAGE_TAG}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"