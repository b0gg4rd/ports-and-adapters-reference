openapi: 3.0.3
info:
  title: @project.description@
  version: @project.version@
servers:
  - url: /api/v1
tags:
  - name: Payments
paths:
  /payments:
    post:
      tags:
        - Payments
      operationId: create-payment
      summary: Create a Payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created.
          headers:
            Payment-Reference:
              description: Payment Reference
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Payments
      operationId: retrieve-all-payments
      summary: Retrieve all Payments.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Payments retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAllPaymentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /payments/{paymentReference}:
    patch:
      tags:
        - Payments
      operationId: partial-update-payment
      summary: Partial update a Payment.
      parameters:
        - name: paymentReference
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
      responses:
        '204':
          description: Payment updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Payments
      operationId: delete-payment
      summary: Delete a Payment.
      parameters:
        - name: paymentReference
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Payment deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Unprocessable entity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        Allow:
          description: Methods supported by the resource.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Payload too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Explanation of the error.
    CreatePaymentRequest:
      type: object
      properties:
        payerReference:
          type: string
          description: Payer Reference.
        payeeReference:
          type: string
          description: Payee Reference.
        paymentAmount:
          type: number
          description: Payment Amount.
        paymentSubject:
          type: string
          description: Payment Subject.
        executionDate:
          type: string
          format: date-time
          description: Execution Date. RFC 3339 date-time with a mandatory offset (e.g. 'Z' or '-06:00'); it is normalized to UTC.
          example: "2030-12-31T10:00:00Z"
    UpdatePaymentRequest:
      type: object
      properties:
        paymentAmount:
          type: number
          description: Payment Amount.
        paymentSubject:
          type: string
          description: Payment Subject.
        executionDate:
          type: string
          format: date-time
          description: Execution Date. RFC 3339 date-time with a mandatory offset (e.g. 'Z' or '-06:00'); it is normalized to UTC.
          example: "2030-12-31T10:00:00Z"
    RetrieveAllPaymentsItemResponse:
      type: object
      properties:
        paymentReference:
          type: string
          description: Payment Reference.
        payerReference:
          type: string
          description: Payer Reference.
        payeeReference:
          type: string
          description: Payee Reference.
        paymentAmount:
          type: string
          description: Payment Amount.
        paymentSubject:
          type: string
          description: Payment Subject.
        executionDate:
          type: string
          format: date-time
          description: Execution Date. RFC 3339 date-time in UTC.
          example: "2030-12-31T10:00:00Z"
        status:
          type: string
          description: Status.
        createdAt:
          type: string
          format: date-time
          description: Created At. RFC 3339 date-time in UTC.
          example: "2026-11-22T19:24:09.556Z"
    RetrieveAllPaymentsResponse:
      type: object
      properties:
        page:
          type: integer
          description: Page number.
        size:
          type: integer
          description: Page size.
        totalElements:
          type: integer
          format: int64
          description: Total elements.
        totalPages:
          type: integer
          description: Total pages.
        content:
          type: array
          items:
            $ref: '#/components/schemas/RetrieveAllPaymentsItemResponse'
